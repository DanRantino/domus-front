name: CI

on:
  push:
    branches: [main, nonprod]
  pull_request:
    branches: [main, nonprod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
